<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Employee</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Edit Employee Details</h2>
  <form id="editEmployeeForm">
  <input type="hidden" id="employeeId">

  <label>Name:</label>
  <input type="text" id="name" name="name" required><br>

  <label>Date of Birth:</label>
  <input type="date" id="dob" name="dob" required><br>

  <label>Email:</label>
  <input type="email" id="emailAddress" name="emailAddress" required><br>

  <label>Address:</label>
  <textarea id="address" name="address" required></textarea><br>

  <label>Gender:</label>
  <select id="gender" name="gender" required>
    <option value="" disabled selected>Select Gender</option>
    <option value="1">Male</option>
    <option value="2">Female</option>
    <option value="3">Others</option>
  </select><br>

  <label>Country:</label>
  <select id="country" name="country" required></select><br>

  <label>State:</label>
  <select id="state" name="state" required></select><br>

  <label>City:</label>
  <select id="city" name="city" required></select><br>

  <label>Languages:</label><br>
  <div id="languages"></div>
  <div id="proficiencies"></div><br>

  <button type="submit">Update</button>
  <button type="button" onclick="window.location.href='DashBoard.html'">Cancel</button>
</form>


  <script src="editEmployeeForm.js"></script>
</body>
</html>
